services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: overdone
      POSTGRES_PASSWORD: overdone
      POSTGRES_DB: overdone
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overdone -d overdone"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://overdone:overdone@db:5432/overdone
      DATA_DIR: /app/data
      BOOTSTRAP: "true"
      HF_HOME: /home/app/.cache/huggingface
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    volumes:
      - hf_cache:/home/app/.cache/huggingface

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

  ollama:
    profiles: [llm]
    image: ollama/ollama:0.11.11
    ports:
      - "11434:11434"

volumes:
  postgres_data:
  hf_cache:
